name: Organize TiMer website files

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract-site:
    if: contains(github.event.head_commit.message, 'Add one-time workflow to organize TiMer website files')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract website into repository root
        run: |
          test -f HIQU-TiMer.zip
          unzip -o HIQU-TiMer.zip -d .
          rm -f .github/workflows/organize-site.yml

      - name: Commit organized website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Organize TiMer website files in repository root"
          git push
